<html lang="sl">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    :root {
      --bg: #f8f9fa;
      --surface: #ffffff;
      --border: rgba(18, 22, 34, 0.08);
      --border-hover: rgba(18, 22, 34, 0.16);
      
      --text-hero: #090a0c;
      --text-body: #23262f;
      --text-muted: #777e90;
      
      --accent: #d9480f;            /* Topla terakota / burnt sienna */
      --accent-soft: rgba(217, 72, 15, 0.08);
      --price-color: #1b7a4b;       /* Žajbljevo zelena za ceno */
      
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-pill: 999px;
      
      --shadow-subtle: 0 1px 3px rgba(0, 0, 0, 0.02), 0 4px 12px rgba(0, 0, 0, 0.04);
      --shadow-hover: 0 12px 30px -4px rgba(18, 22, 34, 0.08), 0 4px 12px -2px rgba(18, 22, 34, 0.03);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(at 0% 0%, rgba(217, 72, 15, 0.03) 0px, transparent 40%),
        radial-gradient(at 100% 10%, rgba(15, 39, 68, 0.03) 0px, transparent 50%);
      color: var(--text-body);
      line-height: 1.5;
      padding-bottom: 5rem;
    }

    /* Hero & Glava */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 3rem 1.5rem 2.2rem;
      text-align: center;
      position: relative;
    }

    .header-inner {
      max-width: 840px;
      margin: 0 auto;
    }

    .brand-eyebrow {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 0.5rem;
      display: inline-block;
    }

    header h1 {
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--text-hero);
      letter-spacing: -0.03em;
      line-height: 1.15;
      margin-bottom: 0.5rem;
    }

    header p {
      color: var(--text-muted);
      font-size: 1.05rem;
      font-weight: 400;
    }

    .date-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 1.2rem;
      background: var(--accent-soft);
      color: var(--accent);
      border: 1px solid rgba(217, 72, 15, 0.18);
      font-weight: 600;
      padding: 0.4rem 1.2rem;
      border-radius: var(--radius-pill);
      font-size: 0.9rem;
    }

    /* Zavirki za izbiro dneva (Editorial Segmented Bar) */
    .day-selector-container {
      max-width: 1240px;
      margin: 2rem auto 0;
      padding: 0 1.5rem;
    }

    .day-selector {
      display: flex;
      gap: 0.4rem;
      background: rgba(230, 234, 240, 0.5);
      padding: 0.4rem;
      border-radius: var(--radius-md);
      overflow-x: auto;
      border: 1px solid var(--border);
    }

    .day-tab {
      flex: 1;
      min-width: 110px;
      background: transparent;
      border: none;
      padding: 0.65rem 0.8rem;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      text-align: center;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .day-tab:hover {
      color: var(--text-hero);
      background: rgba(255, 255, 255, 0.5);
    }

    .day-tab.active {
      background: var(--surface);
      color: var(--text-hero);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    /* Kontrole: Iskalnik & Filtri */
    .controls {
      max-width: 1240px;
      margin: 1.5rem auto 2rem;
      padding: 0 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    @media (min-width: 768px) {
      .controls {
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
      }
    }

    .search-box {
      flex: 1;
      max-width: 440px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 0.75rem 1rem 0.75rem 2.5rem;
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: var(--radius-pill);
      font-size: 0.92rem;
      outline: none;
      transition: all 0.2s;
    }

    .search-box input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .search-icon {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .filter-tags {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 0.45rem 1rem;
      border-radius: var(--radius-pill);
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .filter-btn:hover {
      border-color: var(--border-hover);
      color: var(--text-hero);
    }

    .filter-btn.active {
      background: var(--text-hero);
      color: #ffffff;
      border-color: var(--text-hero);
    }

    /* Mreža restavracij */
    .restaurant-grid {
      max-width: 1240px;
      margin: 0 auto;
      padding: 0 1.5rem;
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.6rem;
    }

    @media (min-width: 768px) {
      .restaurant-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (min-width: 1140px) {
      .restaurant-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    /* Kartica restavracije */
    .restaurant-card {
      background: var(--surface);
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-subtle);
      padding: 1.6rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }

    .restaurant-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-hover);
      border-color: var(--border-hover);
    }

    .card-top {
      margin-bottom: 1.2rem;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.5rem;
      margin-bottom: 0.4rem;
    }

    .restaurant-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-hero);
      letter-spacing: -0.02em;
    }

    .cuisine-tag {
      font-size: 0.72rem;
      font-weight: 600;
      background: rgba(18, 22, 34, 0.04);
      color: var(--text-muted);
      padding: 0.25rem 0.6rem;
      border-radius: var(--radius-sm);
      white-space: nowrap;
    }

    .meta-info {
      font-size: 0.82rem;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    /* Meni sekcija */
    .menu-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.5rem;
      margin-bottom: 0.8rem;
    }

    .menu-header-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--accent);
      font-weight: 700;
    }

    .dish-count {
      font-size: 0.72rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .menu-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-bottom: 1.4rem;
    }

    .menu-item {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding-bottom: 0.75rem;
      border-bottom: 1px dashed rgba(18, 22, 34, 0.08);
      gap: 0.8rem;
    }

    .menu-item:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .dish-name {
      font-size: 0.92rem;
      font-weight: 500;
      color: var(--text-body);
      line-height: 1.35;
    }

    .dish-tag {
      display: inline-block;
      font-size: 0.68rem;
      font-weight: 600;
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
      margin-top: 0.25rem;
    }

    .dish-tag.tag-mesno { background: #fee2e2; color: #991b1b; }
    .dish-tag.tag-veg { background: #dcfce7; color: #166534; }
    .dish-tag.tag-ribe { background: #e0f2fe; color: #0369a1; }

    .dish-price {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--price-color);
      white-space: nowrap;
    }

    /* Gumb na uradno stran */
    .card-footer {
      margin-top: auto;
      padding-top: 0.8rem;
    }

    .restaurant-link {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.4rem;
      width: 100%;
      text-align: center;
      padding: 0.75rem;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-hero);
      text-decoration: none;
      border-radius: var(--radius-sm);
      font-weight: 600;
      font-size: 0.86rem;
      transition: all 0.2s ease;
    }

    .restaurant-link:hover {
      background: var(--text-hero);
      color: #ffffff;
      border-color: var(--text-hero);
    }

    .no-results {
      text-align: center;
      color: var(--text-muted);
      grid-column: 1 / -1;
      padding: 4rem 1rem;
      font-size: 1.1rem;
    }
  </style>
</head>

    // --- LOGIKA PRIKAZA ---
    const now = new Date();
    let currentDayNumber = now.getDay();
    // Če je vikend (sobota/nedelja), privzeto prikažemo ponedeljek (1)
    if (currentDayNumber === 0 || currentDayNumber === 6) currentDayNumber = 1;

    let selectedDay = currentDayNumber;
    let currentFilter = "all";
    let searchQuery = "";

    function setupDateHeader() {
      const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      const formatted = now.toLocaleDateString('sl-SI', options);
      document.getElementById('currentDateBadge').textContent = "📅 Danes: " + formatted.charAt(0).toUpperCase() + formatted.slice(1);
    }

    function updateDayTabs() {
      document.querySelectorAll('.day-tab').forEach(btn => {
        const dayVal = parseInt(btn.dataset.day);
        btn.classList.toggle('active', dayVal === selectedDay);
        // Oznaka za današnji dan
        if (dayVal === currentDayNumber && !btn.textContent.includes('•')) {
          btn.innerHTML = `${btn.textContent} •`;
        }
      });
    }

    function renderRestaurants() {
      const grid = document.getElementById('restaurantGrid');
      grid.innerHTML = "";

      const filtered = restaurantsData.filter(restaurant => {
        // Vzamemo jedi izključno za izbran dan
        const dailyItems = restaurant.weeklyMenu[selectedDay] || [];

        const matchesCategory = currentFilter === "all" || 
          dailyItems.some(dish => dish.category.toLowerCase() === currentFilter.toLowerCase());

        const q = searchQuery.toLowerCase();
        const matchesSearch = 
          restaurant.name.toLowerCase().includes(q) ||
          restaurant.cuisine.toLowerCase().includes(q) ||
          dailyItems.some(dish => dish.name.toLowerCase().includes(q));

        return matchesCategory && matchesSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="no-results">Za ta dan ali filter ni najdenih ujemajočih jedi.</div>`;
        return;
      }

      filtered.forEach(restaurant => {
        const dailyItems = restaurant.weeklyMenu[selectedDay] || [];
        const visibleDishes = currentFilter === "all" 
          ? dailyItems 
          : dailyItems.filter(dish => dish.category.toLowerCase() === currentFilter.toLowerCase());

        const card = document.createElement('article');
        card.className = 'restaurant-card';

        const getTagClass = (cat) => {
          if (cat === 'Mesno') return 'tag-mesno';
          if (cat === 'Vegetarijansko') return 'tag-veg';
          if (cat === 'Ribe') return 'tag-ribe';
          return '';
        };

        card.innerHTML = `
          <div class="card-top">
            <div class="card-header">
              <h2 class="restaurant-title">${restaurant.name}</h2>
              <span class="cuisine-tag">${restaurant.cuisine}</span>
            </div>
            <div class="meta-info">
              <span>🕒 ${restaurant.hours}</span>
              <span>📍 ${restaurant.address}</span>
            </div>
          </div>

          <div>
            <div class="menu-header-bar">
              <span class="menu-header-title">Dnevna ponudba</span>
              <span class="dish-count">${visibleDishes.length} ${visibleDishes.length === 1 ? 'jed' : 'jedi'}</span>
            </div>

            <ul class="menu-list">
              ${visibleDishes.map(dish => `
                <li class="menu-item">
                  <div>
                    <div class="dish-name">${dish.name}</div>
                    <span class="dish-tag ${getTagClass(dish.category)}">${dish.category}</span>
                  </div>
                  <div class="dish-price">${dish.price}</div>
                </li>
              `).join('')}
            </ul>
          </div>

          <div class="card-footer">
            <a href="${restaurant.url}" target="_blank" rel="noopener noreferrer" class="restaurant-link">
              Odpri spletno stran / meni ↗
            </a>
          </div>
        `;

        grid.appendChild(card);
      });
    }

    // Poslušalci dogodkov
    document.querySelectorAll('.day-tab').forEach(btn => {
      btn.addEventListener('click', (e) => {
        selectedDay = parseInt(e.target.dataset.day);
        updateDayTabs();
        renderRestaurants();
      });
    });

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value;
      renderRestaurants();
    });

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        currentFilter = e.target.dataset.filter;
        renderRestaurants();
      });
    });

    // Zagon ob nalaganju
    setupDateHeader();
    updateDayTabs();
    renderRestaurants();
  </script>
