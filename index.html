<head>

  <!-- Sodobna, topla in čitljiva pisava Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    :root {
      /* Topla kulinarična paleta */
      --bg-cream: #F9F6F0;
      --bg-surface: #FFFFFF;
      --border-warm: #EAE4D9;
      --border-light: #F2EDE4;

      /* Primarne barve & akcenti */
      --terracotta: #D9531E;
      --terracotta-hover: #BF4414;
      --terracotta-soft: #FDEEE9;
      --olive: #3B6E47;
      --olive-soft: #EBF4ED;
      --amber: #B45309;
      --amber-soft: #FEF3C7;

      /* Tipografija */
      --text-charcoal: #242220;
      --text-body: #4A4642;
      --text-muted: #827C75;

      /* Sence & radiji */
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-card: 20px;
      --radius-pill: 999px;
      
      --shadow-warm: 0 4px 20px -2px rgba(90, 60, 30, 0.06), 0 2px 6px -1px rgba(90, 60, 30, 0.04);
      --shadow-hover: 0 16px 32px -4px rgba(90, 60, 30, 0.12), 0 6px 12px -2px rgba(90, 60, 30, 0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg-cream);
      background-image: 
        radial-gradient(at 0% 0%, rgba(217, 83, 30, 0.04) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(59, 110, 71, 0.04) 0px, transparent 50%);
      color: var(--text-body);
      line-height: 1.5;
      padding-bottom: 5rem;
    }

    /* Glava / Hero sekcija */
    header {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-warm);
      padding: 2.8rem 1.5rem 2rem;
      text-align: center;
      position: relative;
    }

    .header-inner {
      max-width: 860px;
      margin: 0 auto;
    }

    .hero-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--terracotta);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 0.6rem;
    }

    header h1 {
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--text-charcoal);
      letter-spacing: -0.03em;
      line-height: 1.18;
      margin-bottom: 0.5rem;
    }

    header p {
      color: var(--text-muted);
      font-size: 1.1rem;
      font-weight: 400;
    }

    .date-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 1.2rem;
      background: var(--terracotta-soft);
      color: var(--terracotta);
      border: 1px solid rgba(217, 83, 30, 0.2);
      font-weight: 700;
      padding: 0.45rem 1.3rem;
      border-radius: var(--radius-pill);
      font-size: 0.95rem;
    }

    /* Izbira dneva (Pon - Pet) */
    .day-selector-container {
      max-width: 1240px;
      margin: 1.8rem auto 0;
      padding: 0 1.5rem;
    }

    .day-selector {
      display: flex;
      gap: 0.5rem;
      background: rgba(234, 228, 217, 0.5);
      padding: 0.45rem;
      border-radius: var(--radius-md);
      overflow-x: auto;
      border: 1px solid var(--border-warm);
    }

    .day-tab {
      flex: 1;
      min-width: 110px;
      background: transparent;
      border: none;
      padding: 0.7rem 0.8rem;
      border-radius: 10px;
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
    }

    .day-tab:hover {
      color: var(--text-charcoal);
      background: rgba(255, 255, 255, 0.6);
    }

    .day-tab.active {
      background: var(--bg-surface);
      color: var(--terracotta);
      font-weight: 700;
      box-shadow: 0 2px 8px rgba(90, 60, 30, 0.08);
    }

    /* Hitri filtri na vrhu strani */
    .filter-wrapper {
      max-width: 1240px;
      margin: 1.4rem auto;
      padding: 0 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    @media (min-width: 800px) {
      .filter-wrapper {
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
      }
    }

    .search-box {
      flex: 1;
      max-width: 380px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 0.75rem 1rem 0.75rem 2.6rem;
      border: 1px solid var(--border-warm);
      background: var(--bg-surface);
      border-radius: var(--radius-pill);
      font-size: 0.95rem;
      color: var(--text-charcoal);
      outline: none;
      transition: all 0.2s;
    }

    .search-box input:focus {
      border-color: var(--terracotta);
      box-shadow: 0 0 0 3px var(--terracotta-soft);
    }

    .search-icon {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .quick-filters {
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      padding-bottom: 0.2rem;
    }

    .filter-chip {
      background: var(--bg-surface);
      border: 1px solid var(--border-warm);
      padding: 0.55rem 1.1rem;
      border-radius: var(--radius-pill);
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-charcoal);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .filter-chip:hover {
      border-color: var(--terracotta);
      color: var(--terracotta);
      background: #FFFBF8;
    }

    .filter-chip.active {
      background: var(--terracotta);
      color: #FFFFFF;
      border-color: var(--terracotta);
      box-shadow: 0 3px 10px rgba(217, 83, 30, 0.25);
    }

    /* Mreža kartic (Grid) */
    .restaurant-grid {
      max-width: 1240px;
      margin: 1.5rem auto 0;
      padding: 0 1.5rem;
      display: grid;
      grid-template-columns: 1fr;
      gap: 2rem;
    }

    @media (min-width: 720px) {
      .restaurant-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (min-width: 1100px) {
      .restaurant-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    /* Kartica restavracije */
    .restaurant-card {
      background: var(--bg-surface);
      border-radius: var(--radius-card);
      border: 1px solid var(--border-warm);
      box-shadow: var(--shadow-warm);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .restaurant-card:hover {
      transform: translateY(-5px);
      box-shadow: var(--shadow-hover);
      border-color: rgba(217, 83, 30, 0.25);
    }

    /* Zgornji banner s sliko */
    .card-banner {
      height: 140px;
      position: relative;
      background-size: cover;
      background-position: center;
    }

    .card-banner::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(34, 32, 30, 0.1) 0%, rgba(34, 32, 30, 0.65) 100%);
    }

    .banner-content {
      position: absolute;
      bottom: 0.9rem;
      left: 1.2rem;
      right: 1.2rem;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .restaurant-name {
      color: #FFFFFF;
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
    }

    .cuisine-tag {
      font-size: 0.72rem;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.92);
      color: var(--text-charcoal);
      padding: 0.25rem 0.65rem;
      border-radius: var(--radius-pill);
      backdrop-filter: blur(4px);
    }

    /* Telo kartice */
    .card-body {
      padding: 1.3rem 1.4rem;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .card-meta-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 1.2rem;
      padding-bottom: 0.8rem;
      border-bottom: 1px solid var(--border-light);
    }

    .hours-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-weight: 600;
      color: var(--amber);
      background: var(--amber-soft);
      padding: 0.2rem 0.6rem;
      border-radius: 6px;
      font-size: 0.8rem;
    }

    .location-info {
      font-size: 0.8rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 170px;
    }

    /* Meni / Dnevne jedi */
    .menu-heading {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--terracotta);
      font-weight: 800;
      margin-bottom: 0.8rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .menu-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      margin-bottom: 1.5rem;
    }

    .menu-item {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding-bottom: 0.8rem;
      border-bottom: 1px dashed var(--border-warm);
      gap: 0.8rem;
    }

    .menu-item:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .dish-content {
      flex: 1;
    }

    .dish-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-charcoal);
      line-height: 1.35;
    }

    .dish-detail {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-top: 0.2rem;
    }

    .dish-tag-row {
      display: flex;
      gap: 0.35rem;
      margin-top: 0.35rem;
    }

    .tag-badge {
      font-size: 0.68rem;
      font-weight: 700;
      padding: 0.15rem 0.5rem;
      border-radius: var(--radius-sm);
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .tag-mesno { background: #FDEEE9; color: #C2410C; }
    .tag-vegi { background: #EBF4ED; color: #2D6A4F; }
    .tag-zlica { background: #FEF3C7; color: #92400E; }
    .tag-solata { background: #ECFDF5; color: #047857; }
    .tag-riba { background: #E0F2FE; color: #0369A1; }

    /* Izpostavljena cena (Price pill) */
    .price-pill {
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--terracotta);
      background: var(--terracotta-soft);
      padding: 0.3rem 0.65rem;
      border-radius: var(--radius-pill);
      white-space: nowrap;
    }

    /* Dno kartice z akcijami */
    .card-footer {
      padding: 1rem 1.4rem;
      background: #FAF8F5;
      border-top: 1px solid var(--border-light);
      display: flex;
      gap: 0.6rem;
      align-items: center;
    }

    .btn-primary {
      flex: 1;
      text-align: center;
      background: var(--terracotta);
      color: #FFFFFF;
      text-decoration: none;
      padding: 0.65rem 0.8rem;
      border-radius: var(--radius-sm);
      font-size: 0.88rem;
      font-weight: 700;
      transition: background 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;
    }

    .btn-primary:hover {
      background: var(--terracotta-hover);
    }

    .btn-icon {
      background: var(--bg-surface);
      border: 1px solid var(--border-warm);
      color: var(--text-charcoal);
      text-decoration: none;
      padding: 0.65rem 0.85rem;
      border-radius: var(--radius-sm);
      font-size: 0.88rem;
      font-weight: 600;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn-icon:hover {
      border-color: var(--terracotta);
      color: var(--terracotta);
      background: #FFFFFF;
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 5rem 1rem;
      color: var(--text-muted);
    }
    .empty-state h3 {
      font-size: 1.4rem;
      color: var(--text-charcoal);
      margin-bottom: 0.5rem;
    }
  </style>
</head>

    // --- STANJE IN LOGIKA ---
    const now = new Date();
    let currentDayNumber = now.getDay();
    // Če je vikend, privzeto odpri ponedeljek
    if (currentDayNumber === 0 || currentDayNumber === 6) currentDayNumber = 1;

    let selectedDay = currentDayNumber;
    let currentFilter = "all";
    let searchQuery = "";

    function setDateBanner() {
      const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      const formatted = now.toLocaleDateString('sl-SI', options);
      document.getElementById('todayBanner').textContent = "📅 Danes: " + formatted.charAt(0).toUpperCase() + formatted.slice(1);
    }

    function updateDayTabs() {
      document.querySelectorAll('.day-tab').forEach(btn => {
        const dayVal = parseInt(btn.dataset.day);
        btn.classList.toggle('active', dayVal === selectedDay);
        if (dayVal === currentDayNumber && !btn.textContent.includes('•')) {
          btn.innerHTML = `${btn.textContent} •`;
        }
      });
    }

    function renderRestaurants() {
      const grid = document.getElementById('restaurantGrid');
      grid.innerHTML = "";

      const filtered = restaurantsData.filter(restaurant => {
        const dailyItems = restaurant.weeklyMenu[selectedDay] || [];

        // Filter po značkah
        let matchesFilter = true;
        if (currentFilter === "blizu") {
          matchesFilter = restaurant.nearCenter === true;
        } else if (currentFilter !== "all") {
          matchesFilter = dailyItems.some(dish => dish.tags.includes(currentFilter));
        }

        // Iskalnik po besedilu
        const q = searchQuery.toLowerCase().trim();
        const matchesSearch = q === "" || 
          restaurant.name.toLowerCase().includes(q) ||
          restaurant.cuisine.toLowerCase().includes(q) ||
          dailyItems.some(dish => 
            dish.main.toLowerCase().includes(q) || 
            dish.detail.toLowerCase().includes(q)
          );

        return matchesFilter && matchesSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="empty-state">
            <h3>Za izbrane filtre ni bilo najdenih jedi 🍽️</h3>
            <p>Poskusi izbrati drug filter, drug dan ali ponastavi iskalni niz.</p>
          </div>
        `;
        return;
      }

      filtered.forEach(restaurant => {
        const dailyItems = restaurant.weeklyMenu[selectedDay] || [];
        
        // Prikaz jedi glede na aktiven filter
        let visibleDishes = dailyItems;
        if (currentFilter !== "all" && currentFilter !== "blizu") {
          visibleDishes = dailyItems.filter(dish => dish.tags.includes(currentFilter));
        }

        const card = document.createElement('article');
        card.className = 'restaurant-card';

        // Pretvori oznako v barvno značko
        const renderTagBadges = (tags) => {
          return tags.map(tag => {
            let label = "Jed";
            let cls = "";
            if (tag === "mesno") { label = "Mesno"; cls = "tag-mesno"; }
            if (tag === "vegi") { label = "Vegi"; cls = "tag-vegi"; }
            if (tag === "zlica") { label = "Na žlico"; cls = "tag-zlica"; }
            if (tag === "solata") { label = "Solata"; cls = "tag-solata"; }
            if (tag === "riba") { label = "Riba"; cls = "tag-riba"; }
            return `<span class="tag-badge ${cls}">${label}</span>`;
          }).join('');
        };

        card.innerHTML = `
          <div>
            <!-- Banner s sliko -->
            <div class="card-banner" style="background-image: url('${restaurant.bannerImage}');">
              <div class="banner-content">
                <h2 class="restaurant-name">${restaurant.name}</h2>
                <span class="cuisine-tag">${restaurant.cuisine}</span>
              </div>
            </div>

            <!-- Telo kartice -->
            <div class="card-body">
              <div class="card-meta-bar">
                <span class="hours-badge">🕒 ${restaurant.hours}</span>
                <span class="location-info">📍 ${restaurant.address}</span>
              </div>

              <div class="menu-heading">
                <span>Dnevni meni</span>
                <span style="font-size:0.75rem; color:var(--text-muted); font-weight:600;">${visibleDishes.length} ${visibleDishes.length === 1 ? 'ponudba' : 'ponudbe'}</span>
              </div>

              <ul class="menu-list">
                ${visibleDishes.map(dish => `
                  <li class="menu-item">
                    <div class="dish-content">
                      <div class="dish-title">${dish.main}</div>
                      <div class="dish-detail">${dish.detail}</div>
                      <div class="dish-tag-row">
                        ${renderTagBadges(dish.tags)}
                      </div>
                    </div>
                    <div class="price-pill">${dish.price}</div>
                  </li>
                `).join('')}
              </ul>
            </div>
          </div>

          <!-- Dno kartice z akcijami -->
          <div class="card-footer">
            <a href="${restaurant.url}" target="_blank" rel="noopener noreferrer" class="btn-primary">
              Odpri meni ↗
            </a>
            <a href="${restaurant.mapsUrl}" target="_blank" rel="noopener noreferrer" class="btn-icon" title="Odpri zemljevid">
              📍
            </a>
            <a href="tel:${restaurant.phone.replace(/\s+/g, '')}" class="btn-icon" title="Pokliči restavracijo">
              📞
            </a>
          </div>
        `;

        grid.appendChild(card);
      });
    }

    // Poslušalci dogodkov (Zavihki dnevov)
    document.querySelectorAll('.day-tab').forEach(btn => {
      btn.addEventListener('click', (e) => {
        selectedDay = parseInt(e.target.dataset.day);
        updateDayTabs();
        renderRestaurants();
      });
    });

    // Hitri filtri
    document.querySelectorAll('.filter-chip').forEach(chip => {
      chip.addEventListener('click', (e) => {
        document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
        e.target.classList.add('active');
        currentFilter = e.target.dataset.filter;
        renderRestaurants();
      });
    });

    // Iskalnik
    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value;
      renderRestaurants();
    });

    // Zagon
    setDateBanner();
    updateDayTabs();
    renderRestaurants();
  </script>
