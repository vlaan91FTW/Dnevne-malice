      --terracotta-soft: #FDEEE9;
      --olive: #3B6E47;

      --text-body: #4A4642;
      --text-muted: #827C75;

      --radius-md: 14px;
      --radius-card: 20px;
      --radius-pill: 999px;

    body {

      line-height: 1.5;
      padding-bottom: 5rem;
    }

    header {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-warm);
      padding: 2.8rem 1.5rem 2rem;
      text-align: center;
    }

    .header-inner {
      max-width: 860px;
      margin: 0 auto;
    }

    .hero-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--terracotta);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 0.6rem;
    }

    header h1 {
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--text-charcoal);
      letter-spacing: -0.03em;
      line-height: 1.18;
      margin-bottom: 0.5rem;
    }

    header p {
      color: var(--text-muted);
      font-size: 1.1rem;
    }

      align-items: center;
      gap: 0.5rem;
      margin-top: 1.2rem;
      background: var(--terracotta-soft);
      color: var(--terracotta);

      font-weight: 700;
      padding: 0.45rem 1.3rem;
      border-radius: var(--radius-pill);
      font-size: 0.95rem;

    .filter-wrapper {

      margin: 1.8rem auto 1rem;
      padding: 0 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    @media (min-width: 800px) {
      .filter-wrapper {
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
      }
    }

      flex: 1;
      max-width: 380px;
      position: relative;
    }

      width: 100%;
      padding: 0.75rem 1rem 0.75rem 2.6rem;
      border: 1px solid var(--border-warm);
      background: var(--bg-surface);
      border-radius: var(--radius-pill);
      font-size: 0.95rem;
      color: var(--text-charcoal);
      outline: none;
      transition: all 0.2s;
    }

    .search-box input:focus {
      border-color: var(--terracotta);
      box-shadow: 0 0 0 3px var(--terracotta-soft);
    }

    .search-icon {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .quick-filters {
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      padding-bottom: 0.2rem;
    }

    .filter-chip {
      background: var(--bg-surface);
      border: 1px solid var(--border-warm);
      padding: 0.55rem 1.1rem;
      border-radius: var(--radius-pill);
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-charcoal);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .filter-chip:hover {
      border-color: var(--terracotta);
      color: var(--terracotta);
      background: #FFFBF8;
    }

    .filter-chip.active {
      background: var(--terracotta);
      color: #FFFFFF;
      border-color: var(--terracotta);
      box-shadow: 0 3px 10px rgba(217, 83, 30, 0.25);
    }

    .restaurant-grid {
      max-width: 1240px;
      margin: 1.5rem auto 0;
      padding: 0 1.5rem;
      display: grid;
      grid-template-columns: 1fr;
      gap: 2rem;
    }

    @media (min-width: 720px) {
      .restaurant-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (min-width: 1100px) {

        grid-template-columns: repeat(3, 1fr);
      }

      border: 1px solid var(--border-warm);
      box-shadow: var(--shadow-warm);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.28s cubic-bezier(0.16, 1, 0.3, 1);

      box-shadow: var(--shadow-hover);
      border-color: rgba(217, 83, 30, 0.25);

      background-position: center;
      background-color: #E2D9CC;

      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(34, 32, 30, 0.1) 0%, rgba(34, 32, 30, 0.65) 100%);

      bottom: 0.9rem;

      right: 1.2rem;

      display: flex;
      justify-content: space-between;
      align-items: flex-end;

          { main: "Dnevno kosilo: Piščančji medaljoni z rožmarinom z žara", detail: "goveja ali kremna cvetačna juha s krutoni, maslen krompir, solata", price: "9,40 €", tags: ["mesno", "zlica", "solata"] },
          { main: "Ocvrti lignji z dalmatinsko prilogo", detail: "hrustljavi lignji s prilogo", price: "9,90 €", tags: ["riba"] },
          { main: "Svinjski file v slivovi omaki", detail: "z ingverjem in pomarančno lupinico", price: "9,90 €", tags: ["mesno"] },
          { main: "Pečena svinjska krača", detail: "s prilogo po izbiri", price: "8,20 €", tags: ["mesno"] },
          { main: "Dnevna vege jed: Falafel", detail: "zelenjavni kuskus, jogurtova omaka z meto", price: "7,90 €", tags: ["vegi"] },
          { main: "Jota z domačo klobaso z žara", detail: "gosta topla domača jota", price: "6,50 €", tags: ["zlica", "mesno"] },
          { main: "Zelenjavni krožnik", detail: "maslen krompir, kremna špinača, kuhan korenček na olivnem olju", price: "5,90 €", tags: ["vegi"] }
        ]
      },
      {
        id: 8,
        name: "Restavracija Gurman",
        aliases: "gurman catering zar pleskavica restavracija gurman",
        url: "https://restavracija-gurman.si/sl#meals-section",
        mapsUrl: "https://maps.google.com/?q=Restavracija+Gurman+Nova+Gorica",
        phone: "+386 5 30 21 941",
        cuisine: "Balkanski žar & Domača",
        hours: "10:00 - 16:00",
        address: "Ulica Gradnikove brigade 51",
        bannerImage: "https://images.unsplash.com/photo-1529193591184-b1d58069ecdd?auto=format&fit=crop&w=700&q=80",
        nearCenter: true,
        menu: [
          { main: "Meni 1: Testenine z radičem in klobaso", detail: "samopostrežna solata (bučna ali goveja juha +2 €)", price: "8,00 €", tags: ["mesno", "solata"] },
          { main: "Meni 2: Oslič v pečici z dalmatinsko prilogo", detail: "samopostrežna solata (bučna ali goveja juha +2 €)", price: "8,00 €", tags: ["riba", "solata"] },
          { main: "Meni 3: Pečen piščanec v pečici", detail: "maslen krompir in grah, samopostrežna solata (bučna ali goveja juha +2 €)", price: "8,00 €", tags: ["mesno", "solata"] }
        ]
      }
    ];

    let currentFilter = "all";
    let searchQuery = "";

    function setDateBanner() {
      const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      const formatted = new Date().toLocaleDateString('sl-SI', options);
      document.getElementById('todayBanner').textContent = "📅 Danes: " + formatted.charAt(0).toUpperCase() + formatted.slice(1);
    }

    function renderRestaurants() {
      const grid = document.getElementById('restaurantGrid');
      grid.innerHTML = "";

      const rawQ = searchQuery.toLowerCase().trim();
      const cleanQ = rawQ.replace(/[\s\-_]/g, '');

      const filtered = restaurantsData.filter(restaurant => {
        const dailyItems = restaurant.menu || [];

        let matchesFilter = true;
        if (currentFilter === "blizu") {
          matchesFilter = restaurant.nearCenter === true;
        } else if (currentFilter !== "all") {
          matchesFilter = dailyItems.some(dish => dish.tags && dish.tags.includes(currentFilter));
        }

        const rName = (restaurant.name || "").toLowerCase();
        const rAliases = (restaurant.aliases || "").toLowerCase();
        const rCuisine = (restaurant.cuisine || "").toLowerCase();
        
        const rNameClean = rName.replace(/[\s\-_]/g, '');
        const rAliasesClean = rAliases.replace(/[\s\-_]/g, '');

        const matchesSearch = cleanQ === "" || 
          rName.includes(rawQ) ||
          rNameClean.includes(cleanQ) ||
          rAliases.includes(rawQ) ||
          rAliasesClean.includes(cleanQ) ||
          rCuisine.includes(rawQ) ||
          dailyItems.some(dish => {
            const t = (dish.main || "").toLowerCase();
            const d = (dish.detail || "").toLowerCase();
            return t.includes(rawQ) || d.includes(rawQ);
          });

        return matchesFilter && matchesSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="empty-state">
            <h3>Za izbrane filtre ni bilo najdenih jedi 🍽️</h3>
            <p>Poskusi izbrati drug filter ali ponastavi iskanje.</p>
          </div>
        `;
        return;
      }

      filtered.forEach(restaurant => {
        const dailyItems = restaurant.menu || [];
        
        let visibleDishes = dailyItems;
        if (currentFilter !== "all" && currentFilter !== "blizu") {
          visibleDishes = dailyItems.filter(dish => dish.tags && dish.tags.includes(currentFilter));
        }

        const card = document.createElement('article');
        card.className = 'restaurant-card';

        const renderTagBadges = (dish) => {
          let tags = dish.tags || ['mesno'];
          return tags.map(tag => {
            let label = "Jed";
            let cls = "";
            if (tag === "mesno") { label = "Mesno"; cls = "tag-mesno"; }
            if (tag === "vegi") { label = "Vegi"; cls = "tag-vegi"; }
            if (tag === "zlica") { label = "Na žlico"; cls = "tag-zlica"; }
            if (tag === "solata") { label = "Solata"; cls = "tag-solata"; }
            if (tag === "riba") { label = "Riba"; cls = "tag-riba"; }
            return `<span class="tag-badge ${cls}">${label}</span>`;
          }).join('');
        };

        const phoneClean = (restaurant.phone || "").replace(/\s+/g, '');

        card.innerHTML = `
          <div>
            <div class="card-banner" style="background-image: url('${restaurant.bannerImage}');">
              <div class="banner-content">
                <h2 class="restaurant-name">${restaurant.name}</h2>
                <span class="cuisine-tag">${restaurant.cuisine}</span>
              </div>
            </div>

            <div class="card-body">
              <div class="card-meta-bar">
                <span class="hours-badge">🕒 ${restaurant.hours}</span>
                <span class="location-info">📍 ${restaurant.address}</span>
              </div>

              <div class="menu-heading">
                <span>Danes na meniju</span>
                <span style="font-size:0.75rem; color:var(--text-muted); font-weight:600;">${visibleDishes.length} ${visibleDishes.length === 1 ? 'ponudba' : 'ponudbe'}</span>
              </div>

              <ul class="menu-list">
                ${visibleDishes.map(dish => `
                  <li class="menu-item">
                    <div class="dish-content">
                      <div class="dish-title">${dish.main}</div>
                      <div class="dish-detail">${dish.detail || ""}</div>
                      <div class="dish-tag-row">
                        ${renderTagBadges(dish)}
                      </div>
                    </div>
                    <div class="price-pill">${dish.price}</div>
                  </li>
                `).join('')}
              </ul>
            </div>
          </div>

          <div class="card-footer">
            <a href="${restaurant.url}" target="_blank" rel="noopener noreferrer" class="btn-primary">
              Odpri uradni meni ↗
            </a>
            <a href="${restaurant.mapsUrl}" target="_blank" rel="noopener noreferrer" class="btn-icon" title="Odpri zemljevid">
              📍
            </a>
            ${phoneClean ? `<a href="tel:${phoneClean}" class="btn-icon" title="Pokliči">📞</a>` : ''}
          </div>
        `;

        grid.appendChild(card);
      });
    }

    document.querySelectorAll('.filter-chip').forEach(chip => {
      chip.addEventListener('click', (e) => {
        document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
        e.target.classList.add('active');
        currentFilter = e.target.dataset.filter;
        renderRestaurants();
      });
    });

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value;
      renderRestaurants();
    });

    setDateBanner();
    renderRestaurants();
  </script>
</body>
</html>
