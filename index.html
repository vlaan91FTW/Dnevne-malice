<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dnevne Malice in Kosila | Nova Gorica & Solkan</title>
  <style>
    :root {
      /* Profesionalna svetlo-modra paleta z visokim kontrastom */
      --bg-gradient: linear-gradient(180deg, #f0f6fc 0%, #e6eff8 100%);
      --card-bg: #ffffff;
      --card-border: #dbe4ee;
      --primary: #0f2744;          /* Globoka mornarsko modra */
      --accent: #0284c7;           /* Elegantna modra za poudarke */
      --accent-soft: #e0f2fe;
      --text-main: #1e293b;        /* Skoraj črna za maksimalno berljivost */
      --text-muted: #64748b;
      --price-color: #047857;      /* Smaragdno zelena za cene */
      --shadow-card: 0 4px 14px rgba(15, 39, 68, 0.06);
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: var(--bg-gradient);
      min-height: 100vh;
      color: var(--text-main);
      line-height: 1.5;
      padding-bottom: 4rem;
    }

    /* Glava strani */
    header {
      background: #ffffff;
      border-bottom: 1px solid var(--card-border);
      padding: 2.2rem 1rem 1.8rem;
      text-align: center;
      box-shadow: 0 2px 8px rgba(15, 39, 68, 0.04);
    }

    .header-content {
      max-width: 900px;
      margin: 0 auto;
    }

    header h1 {
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 0.3rem;
    }

    header p {
      color: var(--text-muted);
      font-size: 1.05rem;
    }

    .date-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.8rem;
      background: var(--accent-soft);
      color: var(--primary);
      border: 1px solid #bae6fd;
      font-weight: 700;
      padding: 0.4rem 1.2rem;
      border-radius: 999px;
      font-size: 0.95rem;
    }

    /* Izbira dneva */
    .day-selector-container {
      max-width: 1200px;
      margin: 1.5rem auto 0;
      padding: 0 1rem;
    }

    .day-selector {
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      padding-bottom: 0.4rem;
    }

    .day-tab {
      background: #ffffff;
      border: 1px solid var(--card-border);
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .day-tab:hover {
      border-color: var(--accent);
      color: var(--primary);
    }

    .day-tab.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
      box-shadow: 0 4px 10px rgba(15, 39, 68, 0.2);
    }

    /* Iskalnik in filtri */
    .controls {
      max-width: 1200px;
      margin: 1.2rem auto;
      padding: 0 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    @media (min-width: 680px) {
      .controls {
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
      }
    }

    .search-box {
      flex: 1;
      max-width: 420px;
    }

    .search-box input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid var(--card-border);
      background: #ffffff;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
    }

    .filter-tags {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: #ffffff;
      border: 1px solid var(--card-border);
      padding: 0.45rem 1rem;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-btn.active, .filter-btn:hover {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    /* Mreža restavracij */
    .restaurant-grid {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1rem;
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
    }

    @media (min-width: 768px) {
      .restaurant-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (min-width: 1100px) {
      .restaurant-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    /* Kartica restavracije */
    .restaurant-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px solid var(--card-border);
      box-shadow: var(--shadow-card);
      padding: 1.4rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .restaurant-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 22px rgba(15, 39, 68, 0.1);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.35rem;
      gap: 0.5rem;
    }

    .restaurant-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--primary);
    }

    .cuisine-tag {
      font-size: 0.75rem;
      font-weight: 600;
      background: #f1f5f9;
      color: var(--text-muted);
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
      white-space: nowrap;
    }

    .meta-info {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 1.1rem;
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    /* Meni / Jedilnik */
    .menu-header-box {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #f1f5f9;
      padding-bottom: 0.4rem;
      margin-bottom: 0.8rem;
    }

    .menu-title {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--accent);
      font-weight: 700;
    }

    .menu-count {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .menu-list {
      list-style: none;
      margin-bottom: 1.4rem;
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
    }

    .menu-item {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding-bottom: 0.7rem;
      border-bottom: 1px dashed #e2e8f0;
      gap: 0.75rem;
    }

    .menu-item:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .dish-info {
      flex: 1;
    }

    .dish-name {
      font-weight: 500;
      font-size: 0.92rem;
      color: var(--text-main);
      line-height: 1.35;
    }

    .dish-tag {
      display: inline-block;
      font-size: 0.68rem;
      font-weight: 600;
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
      margin-top: 0.25rem;
    }

    .dish-tag.tag-mesno { background: #fee2e2; color: #991b1b; }
    .dish-tag.tag-veg { background: #dcfce7; color: #166534; }
    .dish-tag.tag-ribe { background: #e0f2fe; color: #075985; }

    .dish-price {
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--price-color);
      white-space: nowrap;
    }

    /* Povezava */
    .card-footer {
      margin-top: auto;
      padding-top: 0.8rem;
    }

    .restaurant-link {
      display: block;
      width: 100%;
      text-align: center;
      padding: 0.65rem;
      background: #f8fafc;
      border: 1px solid var(--card-border);
      color: var(--primary);
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.88rem;
      transition: all 0.2s;
    }

    .restaurant-link:hover {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    .no-results {
      text-align: center;
      color: var(--text-muted);
      grid-column: 1 / -1;
      padding: 3rem 0;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-content">
      <h1>🍽️ Malice na enem mestu</h1>
      <p>Pregled dnevnih malic in kosil v Novi Gorici in Solkanu</p>
      <div class="date-badge" id="currentDateBadge">Nalagam datum...</div>
    </div>
  </header>

  <!-- Izbira dneva (Ponedeljek - Sobota) -->
  <div class="day-selector-container">
    <div class="day-selector" id="daySelector">
      <button class="day-tab" data-day="1">Ponedeljek</button>
      <button class="day-tab" data-day="2">Torek</button>
      <button class="day-tab" data-day="3">Sreda</button>
      <button class="day-tab" data-day="4">Četrtek</button>
      <button class="day-tab" data-day="5">Petek</button>
      <button class="day-tab" data-day="6">Sobota</button>
    </div>
  </div>

  <div class="controls">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Išči po jedeh ali restavracijah..." />
    </div>
    <div class="filter-tags">
      <button class="filter-btn active" data-filter="all">Vse jedi</button>
      <button class="filter-btn" data-filter="Mesno">Mesno</button>
      <button class="filter-btn" data-filter="Vegetarijansko">Vegetarijansko</button>
      <button class="filter-btn" data-filter="Ribe">Ribe</button>
    </div>
  </div>

  <main class="restaurant-grid" id="restaurantGrid"></main>

  <script>
    // --- BAZA VSEH MOŽNOSTI JEDI PO DNEVIH (1=Pon, 2=Tor, 3=Sre, 4=Čet, 5=Pet, 6=Sob) ---
    const restaurantsData = [
      {
        id: 1,
        name: "Restavracija Interspar",
        url: "https://www.spar.si/restavracija-interspar/tedenski-meni",
        cuisine: "Samopostrežna & Kosila",
        hours: "10:30 - 15:30",
        address: "Supernova Qlandia, Nova Gorica",
        weeklyMenu: {
          3: [ // SREDA
            { name: "Goveji zrezek v jurčkovi omaki z domačimi kruhovimi cmoki", price: "€8.50", category: "Mesno" },
            { name: "Ocvrt piščančji file s francosko solato in pečenim krompirjem", price: "€7.90", category: "Mesno" },
            { name: "Pečen file osliča po tržaško s kuhanim krompirjem in blitvo", price: "€8.20", category: "Ribe" },
            { name: "Kremna rižota s porom, jurčki in parmezanom", price: "€6.90", category: "Vegetarijansko" },
            { name: "Pasulj s prekajeno kranjsko klobaso", price: "€7.10", category: "Mesno" },
            { name: "Zelenjavna enolončnica s piro in korenčkom", price: "€3.50", category: "Vegetarijansko" }
          ]
        }
      },
      {
        id: 2,
        name: "Restavracija Sabotin",
        url: "https://hotelsabotin.com/posebne-ponudbe/malice-in-kosila-sa/",
        cuisine: "Domača & Tradicionalna",
        hours: "10:00 - 15:00",
        address: "Cesta IX. korpusa 35, Solkan",
        weeklyMenu: {
          3: [ // SREDA
            { name: "Svinjski medaljoni v poprovi omaki s sirovimi štruklji", price: "€8.50", category: "Mesno" },
            { name: "Puranji paprikaš s širokimi rezanci in solato", price: "€7.50", category: "Mesno" },
            { name: "Gratinirana zelenjavna lazanja s parmezanom", price: "€7.20", category: "Vegetarijansko" },
            { name: "Domači goveji golaž s koruzno polento", price: "€7.90", category: "Mesno" },
            { name: "File soške postrvi na žaru s krompirjevo solato", price: "€8.80", category: "Ribe" }
          ]
        }
      },
      {
        id: 3,
        name: "Gostilna Zvezda",
        url: "https://www.gostilna-zvezda.si/",
        cuisine: "Pizzerija & Mediteranska",
        hours: "10:30 - 15:00",
        address: "Cesta IX. korpusa 65, Solkan",
        weeklyMenu: {
          3: [ // SREDA
            { name: "Domači njoki s pršutom in jurčki v smetanovi omaki", price: "€8.50", category: "Mesno" },
            { name: "Pleskavica na žaru s kajmakom, ajvarjem in pečenim krompirjem", price: "€8.20", category: "Mesno" },
            { name: "Pizza dneva (mocarela, jurčki, rukola in češnjev paradižnik)", price: "€8.00", category: "Vegetarijansko" },
            { name: "Velik solatni krožnik s toplim popečenim piščancem in semeni", price: "€7.80", category: "Mesno" },
            { name: "Testenine s paradižnikovo omako, baziliko in burrato", price: "€7.50", category: "Vegetarijansko" }
          ]
        }
      },
      {
        id: 4,
        name: "Restavracija Vrtnica",
        url: "https://www.restavracija-vrtnica.si/",
        cuisine: "Kosila & Malice",
        hours: "10:00 - 15:00",
        address: "Kidričeva ulica 11, Nova Gorica",
        weeklyMenu: {
          3: [ // SREDA
            { name: "Dušena govedina v lovski omaki z domačim kruhovim cmokom", price: "€8.00", category: "Mesno" },
            { name: "Puranji zrezek na žaru s sotirano zelenjavo in pomfrijem", price: "€7.70", category: "Mesno" },
            { name: "Zelenjavni rizi-bizi s parmezanom in sezonsko solato", price: "€6.80", category: "Vegetarijansko" },
            { name: "Vojvodinska enolončnica s prekajenim mesom in domača sladica", price: "€6.50", category: "Mesno" }
          ]
        }
      },
      {
        id: 5,
        name: "Restavracija Eda",
        url: "https://edarestavracija.si/kosila-malice",
        cuisine: "Sodobna & Poslovna kosila",
        hours: "10:30 - 14:30",
        address: "Delpinova ulica 18b (Eda Center), Nova Gorica",
        weeklyMenu: {
          3: [ // SREDA
            { name: "File orade na žaru s tržaško omako, blitvo in slanim krompirjem", price: "€9.80", category: "Ribe" },
            { name: "Telečji ragu s širokimi domačimi rezanci in zorjenim sirom", price: "€8.90", category: "Mesno" },
            { name: "Kremna bučna rižota s kozjim sirom, orehi in bučnim oljem", price: "€7.90", category: "Vegetarijansko" },
            { name: "Hrustljavi piščančji file v gorgonzolini omaki z rižem", price: "€8.20", category: "Mesno" }
          ]
        }
      },
      {
        id: 6,
        name: "Restavracija Gurman",
        url: "https://restavracija-gurman.si/sl#meals-section",
        cuisine: "Balkanska & Žar",
        hours: "10:00 - 16:00",
        address: "Ulica Gradnikove brigade 51, Nova Gorica",
        weeklyMenu: {
          3: [ // SREDA
            { name: "Čevapčiči (5 kosov) v lepinji s kajmakom, čebulo in pečenim krompirjem", price: "€8.00", category: "Mesno" },
            { name: "Piščančji ražnjiči oviti v hrustljavo slanino z djuveč rižem", price: "€8.20", category: "Mesno" },
            { name: "Gurmanska polnjena pleskavica s sirom in prilogo", price: "€8.50", category: "Mesno" },
            { name: "Prebranac (gravče na tavče) s pečenimi rdečimi paprikami", price: "€6.50", category: "Vegetarijansko" }
          ]
        }
      }
    ];

    // --- LOGIKA ZA DANAŠNJI DAN ---
    const now = new Date();
    // getDay(): 0 = Nedelja, 1 = Pon, 2 = Tor, 3 = Sre, 4 = Čet, 5 = Pet, 6 = Sob
    let currentDayNumber = now.getDay();
    if (currentDayNumber === 0) currentDayNumber = 1; // Če je nedelja, prikaži ponedeljek

    let selectedDay = currentDayNumber;
    let currentFilter = "all";
    let searchQuery = "";

    function setupDateHeader() {
      const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      const formatted = now.toLocaleDateString('sl-SI', options);
      // Prikaz točnega datuma (npr. Sreda, 21. oktober 2026)
      document.getElementById('currentDateBadge').textContent = "📅 Danes: " + formatted.charAt(0).toUpperCase() + formatted.slice(1);
    }

    function updateDayTabs() {
      document.querySelectorAll('.day-tab').forEach(btn => {
        const dayVal = parseInt(btn.dataset.day);
        btn.classList.toggle('active', dayVal === selectedDay);
        // Oznaka za današnji dan
        if (dayVal === currentDayNumber && !btn.textContent.includes('•')) {
          btn.innerHTML = `${btn.textContent} •`;
        }
      });
    }

    function renderRestaurants() {
      const grid = document.getElementById('restaurantGrid');
      grid.innerHTML = "";

      const filtered = restaurantsData.filter(restaurant => {
        // Vzame menije za točno ta dan (če za kak dan ni vnosa, vzame sredo)
        const dailyItems = restaurant.weeklyMenu[selectedDay] || restaurant.weeklyMenu[3] || [];

        const matchesCategory = currentFilter === "all" || 
          dailyItems.some(dish => dish.category.toLowerCase() === currentFilter.toLowerCase());

        const q = searchQuery.toLowerCase();
        const matchesSearch = 
          restaurant.name.toLowerCase().includes(q) ||
          restaurant.cuisine.toLowerCase().includes(q) ||
          dailyItems.some(dish => dish.name.toLowerCase().includes(q));

        return matchesCategory && matchesSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="no-results">Ni najdenih jedi ali restavracij za izbrane kriterije.</div>`;
        return;
      }

      filtered.forEach(restaurant => {
        const dailyItems = restaurant.weeklyMenu[selectedDay] || restaurant.weeklyMenu[3] || [];
        
        const visibleDishes = currentFilter === "all" 
          ? dailyItems 
          : dailyItems.filter(dish => dish.category.toLowerCase() === currentFilter.toLowerCase());

        const card = document.createElement('article');
        card.className = 'restaurant-card';

        const getTagClass = (cat) => {
          if (cat === 'Mesno') return 'tag-mesno';
          if (cat === 'Vegetarijansko') return 'tag-veg';
          if (cat === 'Ribe') return 'tag-ribe';
          return '';
        };

        card.innerHTML = `
          <div>
            <div class="card-header">
              <h2 class="restaurant-title">${restaurant.name}</h2>
              <span class="cuisine-tag">${restaurant.cuisine}</span>
            </div>
            <div class="meta-info">
              <span>🕒 ${restaurant.hours}</span>
              <span>📍 ${restaurant.address}</span>
            </div>

            <div class="menu-header-box">
              <span class="menu-title">Vse izbire za ta dan</span>
              <span class="menu-count">${visibleDishes.length} ${visibleDishes.length === 1 ? 'jed' : 'jedi'}</span>
            </div>

            <ul class="menu-list">
              ${visibleDishes.map(dish => `
                <li class="menu-item">
                  <div class="dish-info">
                    <div class="dish-name">${dish.name}</div>
                    <span class="dish-tag ${getTagClass(dish.category)}">${dish.category}</span>
                  </div>
                  <div class="dish-price">${dish.price}</div>
                </li>
              `).join('')}
            </ul>
          </div>

          <div class="card-footer">
            <a href="${restaurant.url}" target="_blank" rel="noopener noreferrer" class="restaurant-link">
              Odpri uradni meni / spletno stran ↗
            </a>
          </div>
        `;

        grid.appendChild(card);
      });
    }

    // Poslušalci dogodkov
    document.querySelectorAll('.day-tab').forEach(btn => {
      btn.addEventListener('click', (e) => {
        selectedDay = parseInt(e.target.dataset.day);
        updateDayTabs();
        renderRestaurants();
      });
    });

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value;
      renderRestaurants();
    });

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        currentFilter = e.target.dataset.filter;
        renderRestaurants();
      });
    });

    // Zagon
    setupDateHeader();
    updateDayTabs();
    renderRestaurants();
  </script>
</body>
</html>
