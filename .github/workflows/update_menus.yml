name: Avtomatska posodobitev menijev

on:
  schedule:
    # 07:15 UTC (08:15 po zimskem času v SLO)
    - cron: '15 7 * * 1-5'
    # 08:30 UTC (09:30 po zimskem času v SLO)
    - cron: '30 8 * * 1-5'
    # 09:30 UTC (10:30 po zimskem času v SLO - ko vsi objavijo)
    - cron: '30 9 * * 1-5'
  workflow_dispatch: # Ročni zagon na klik

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Prenos repozitorija
        uses: actions/checkout@v4

      - name: Namestitev Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Namestitev orodij
        run: |
          pip install google-genai requests beautifulsoup4 Pillow

      - name: Zagon AI robota za branje menijev
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scraper.py

      - name: Shrani nov menus.json nazaj v repozitorij
        run: |
          git config --global user.name "Malice Bot"
          git config --global user.email "bot@malice.local"
          git add menus.json
          git commit -m "Avtomatska osvežitev menijev [skip ci]" || exit 0
          git push
