name: Avtomatska posodobitev menijev

on:
  schedule:
    - cron: '15 6 * * 1-5'
    - cron: '30 8 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install google-generativeai requests beautifulsoup4
      - name: Zagon AI robota
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scraper.py
      - name: Shrani nov menus.json
        run: |
          git config --global user.name "Malice Bot"
          git config --global user.email "bot@malice.local"
          git add menus.json
          git commit -m "Posodobitev menijev [skip ci]" || exit 0
          git push
