name: Avtomatska posodobitev menijev

on:
  schedule:
    # Zažene se vsak delovnik (Pon-Pet) ob 07:30 UTC (09:30 po našem času)
    - cron: '30 7 * * 1-5'
  workflow_dispatch: # Omogoča tudi ročni zagon s klikom na gumb

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Prenos repozitorija
        uses: actions/checkout@v4

      - name: Namestitev Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Namestitev knjižnic
        run: |
          pip install beautifulsoup4

      - name: Zagon robota za malice
        run: |
          python scraper.py

      - name: Shrani posodobljen menus.json
        run: |
          git config --global user.name "Malice Bot"
          git config --global user.email "bot@malice.local"
          git add menus.json
          git commit -m "Avtomatska posodobitev menija dneva" || exit 0
          git push
