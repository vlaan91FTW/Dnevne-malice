name: Avtomatska posodobitev menijev

on:
  schedule:
    # 06:15 UTC (07:15 po našem času)
    - cron: '15 6 * * 1-5'
    # 08:30 UTC (09:30 po našem času)
    - cron: '30 8 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Prenos repozitorija
        uses: actions/checkout@v4

      - name: Namestitev Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Namestitev orodij
        run: |
          pip install google-genai requests beautifulsoup4

      - name: Zagon AI robota
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scraper.py

      - name: Shrani nov menus.json
        run: |
          git config --global user.name "Malice Bot"
          git config --global user.email "bot@malice.local"
          git add menus.json
          git commit -m "Avtomatska osvežitev menijev (Batch mode) [skip ci]" || exit 0
          git push
