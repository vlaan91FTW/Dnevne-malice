name: Avtomatska posodobitev menijev

on:
  schedule:
    # Zagon samo enkrat dnevno ob 08:00 UTC (10:00 po lokalnem času)
    - cron: '0 8 * * 1-5'
  workflow_dispatch: # Ročni zagon na klik

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Prenos repozitorija
        uses: actions/checkout@v4

      - name: Namestitev Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Namestitev orodij
        run: |
          pip install google-generativeai requests beautifulsoup4

      - name: Zagon AI robota za branje menijev
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scraper.py

      - name: Shrani nov menus.json nazaj v repozitorij
        run: |
          git config --global user.name "Malice Bot"
          git config --global user.email "bot@malice.local"
          git add menus.json
          git commit -m "Avtomatska osvežitev menijev [skip ci]" || exit 0
          git push
